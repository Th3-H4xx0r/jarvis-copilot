[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarviscopilot-client"
version = "0.1.0"
description = "JarvisCopilot desktop client — pair with a JC server, expose native skills (open apps, mouse/keyboard, clipboard, screenshot, …) back to the agent."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "JarvisCopilot" }]
license = { text = "MIT" }

dependencies = [
  # Core WS framing.
  "wsproto>=1.2,<2",
  # Cross-platform mouse + keyboard control.
  "pynput>=1.7,<2",
  # Clipboard read/write on all three OSes.
  "pyperclip>=1.8,<2",
  # Notifications / tray rely on Pillow for icon rendering.
  "pillow>=10,<13",
  # System tray (Windows + macOS menubar + Linux AppIndicator).
  "pystray>=0.19,<0.21",
  # OS-secure credential storage.
  "keyring>=24,<26",
  # YAML fallback for hand-edited config files (json is the default).
  "pyyaml>=6.0,<7",
  # MCP SDK — powers `jc-client mcp-serve` (the jarviscopilot-code-assist
  # stdio server that Claude Code launches). Without it the server crashes
  # on launch and Claude reports the MCP connection as failed (-32000).
  "mcp>=1.2,<2",
  # Modern pair dialog. Embeds the native system webview — WebKit on
  # macOS, WebView2 on Windows (preinstalled on Win11 / modern Win10),
  # WebKitGTK on Linux (needs `python3-webkit2gtk-4.0` or similar).
  # Falls back to a plain Tk dialog if webview can't initialise.
  "pywebview>=5,<7",
  # Platform helpers pywebview needs at runtime. They're optional via
  # markers so the wheel-only platforms (Linux/Win) don't pull macOS-
  # specific PyObjC frameworks.
  "pyobjc-core>=10,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit>=10,<13; sys_platform == 'darwin'",
  # Fast computer control (skills/ui.py): the accessibility tree, window capture
  # and Apple's on-device text recognition.
  "pyobjc-framework-ApplicationServices>=10,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=10,<13; sys_platform == 'darwin'",
  "pythonnet>=3.0,<4; sys_platform == 'win32'",
  # The PC (Windows client, 2026-11-15): processes, Win32/COM, UI Automation, audio sessions.
  "psutil>=5.9,<8; sys_platform == 'win32'",
  "pywin32>=306,<312; sys_platform == 'win32'",
  "comtypes>=1.4,<2; sys_platform == 'win32'",
  "uiautomation>=2.0,<3; sys_platform == 'win32'",
  "pycaw>=20240316,<20270000; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Single-file binary builds via PyInstaller. Not part of the install
# users run on their machines — only used by the release workflow.
build = ["pyinstaller>=6,<7"]
dev = ["pytest>=7,<9"]

[project.scripts]
jc-client = "jc_client.cli:main"

[tool.setuptools.packages.find]
include = ["jc_client", "jc_client.*"]

# The wearable pictures in the tray menu: renders of each device's own 3D model,
# produced by the iOS app's render harness and shipped here as PNGs.
#
# The voice panel's dylib is committed built, not compiled on install: the
# installer is a git clone and a pip install, and asking every Mac to have Xcode
# just to see the menubar orb is a worse trade than 1.3 MB in the repo. Rebuild
# it with mac_app/build.sh after touching anything under mac_app/ or the phone's
# Voice sources. The .bundle beside it carries the orb's compiled shader and is
# found by looking next to the dylib, so the two must stay together.
[tool.setuptools.package-data]
jc_client = [
  "assets/*.png",
  "assets/*.dylib",
  "assets/JarvisVoiceUI_JarvisVoiceUI.bundle/*",
]
