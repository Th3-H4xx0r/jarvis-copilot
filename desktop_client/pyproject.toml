[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarviscopilot-client"
version = "0.1.0"
description = "JarvisCopilot desktop client — pair with a JC server, expose native skills (open apps, mouse/keyboard, clipboard, screenshot, …) back to the agent."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "JarvisCopilot" }]
license = { text = "MIT" }

dependencies = [
  # Core WS framing.
  "wsproto>=1.2",
  # Cross-platform mouse + keyboard control.
  "pynput>=1.7",
  # Clipboard read/write on all three OSes.
  "pyperclip>=1.8",
  # Notifications / tray rely on Pillow for icon rendering.
  "pillow>=10",
  # System tray (Windows + macOS menubar + Linux AppIndicator).
  "pystray>=0.19",
  # OS-secure credential storage.
  "keyring>=24",
  # YAML fallback for hand-edited config files (json is the default).
  "pyyaml>=6.0",
  # Modern pair dialog. Embeds the native system webview — WebKit on
  # macOS, WebView2 on Windows (preinstalled on Win11 / modern Win10),
  # WebKitGTK on Linux (needs `python3-webkit2gtk-4.0` or similar).
  # Falls back to a plain Tk dialog if webview can't initialise.
  "pywebview>=5",
  # Platform helpers pywebview needs at runtime. They're optional via
  # markers so the wheel-only platforms (Linux/Win) don't pull macOS-
  # specific PyObjC frameworks.
  "pyobjc-core>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit>=10; sys_platform == 'darwin'",
  "pythonnet>=3.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Single-file binary builds via PyInstaller. Not part of the install
# users run on their machines — only used by the release workflow.
build = ["pyinstaller>=6"]
dev = ["pytest>=7"]

[project.scripts]
jc-client = "jc_client.cli:main"

[tool.setuptools.packages.find]
include = ["jc_client", "jc_client.*"]
