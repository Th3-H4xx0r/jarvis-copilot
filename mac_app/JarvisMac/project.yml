# The Jarvis Mac app: notch island + menu bar for the coding agents (and the
# rest of Jarvis). Generate with `xcodegen` (mac_app/build-app.sh does it); the
# generated JarvisMac.xcodeproj is not committed — never edit it by hand.
name: JarvisMac
options:
  bundleIdPrefix: com.jarviscopilot
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 3CLSKGFAC9
    # Manual signing with the Apple Development certificate (by SHA-1: two
    # certificates share the name). A plain Mac app with no restricted
    # entitlements needs no provisioning profile, and no Xcode account.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: 9D37CB18DB604B9D715D00D7AD3B28C91EC07D77
    PROVISIONING_PROFILE_SPECIFIER: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Jarvis:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarviscopilot.mac
        PRODUCT_NAME: Jarvis
        PRODUCT_MODULE_NAME: Jarvis
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Jarvis.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  JarvisTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Jarvis
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Jarvis.app/Contents/MacOS/Jarvis"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
        JarvisTests: [test]
    test:
      targets: [JarvisTests]
