# The Jarvis Mac app: notch island + menu bar for the coding agents (and the
# rest of Jarvis). Generate with `xcodegen` (mac_app/build-app.sh does it); the
# generated JarvisMac.xcodeproj is not committed — never edit it by hand.
name: JarvisMac
options:
  bundleIdPrefix: com.jarviscopilot
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 3CLSKGFAC9
    # Manual signing with the Apple Development certificate (by SHA-1: two
    # certificates share the name). A plain Mac app with no restricted
    # entitlements needs no provisioning profile, and no Xcode account.
    # build-app.sh switches to automatic signing + Jarvis-push.entitlements
    # (Wake Mac push) when Xcode has an account or a Mac push profile exists.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: 9D37CB18DB604B9D715D00D7AD3B28C91EC07D77
    PROVISIONING_PROFILE_SPECIFIER: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
packages:
  # Mac screen sharing (Sources/Screen): the same libwebrtc build as the iPhone app.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 156.0.0
targets:
  Jarvis:
    type: application
    platform: macOS
    dependencies:
      - package: WebRTC
      # Share → Jarvis (Holo Drop), embedded in Contents/PlugIns.
      - target: JarvisHoloShare
      # The Jarvis Glasses camera (CoreMediaIO system extension), embedded in
      # Contents/Library/SystemExtensions and activated from Settings → Glasses camera.
      - target: JarvisGlassesCamera
    sources:
      - path: Sources
      # The one accent colour, shared with the iPhone app and the voice dylib.
      - path: ../../ios_app/JarvisCopilot/Copilot/Shared/JcAccent.swift
      # The Jarvis loader (every indeterminate spinner), the iPhone app's own file:
      # one place to restyle it on both.
      - path: ../../ios_app/JarvisCopilot/Copilot/UI/JcLoader.swift
      # The real Jarvis orb (the phone's and the voice panel's shader).
      - path: ../../ios_app/JarvisCopilot/Copilot/Voice/Views/OrbShader.metal
      # The chat's markdown blocks, the phone's own parser.
      - path: ../../ios_app/JarvisCopilot/Copilot/Chat/MarkdownBlocks.swift
      - path: ../../ios_app/JarvisCopilot/Copilot/Chat/ChatMedia.swift
      # Who answered a reply ("Claude Opus 5.5 · 3.2 s · routed deep 82%"), the phone's own words.
      - path: ../../ios_app/JarvisCopilot/Copilot/Chat/HarnessFormat.swift
      # The Mac password approval message the iPhone signs and the Mac checks.
      - path: ../../ios_app/JarvisCopilot/Copilot/Agents/MacPasswordWire.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarviscopilot.mac
        PRODUCT_NAME: Jarvis
        # The Jarvis logo (the iPhone app's), on the macOS rounded square.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: Jarvis
        INFOPLIST_FILE: Info.plist
        # build-app.sh swaps in Jarvis-push.entitlements through JARVIS_ENTITLEMENTS (not
        # CODE_SIGN_ENTITLEMENTS, which would land on the Share extension too).
        JARVIS_ENTITLEMENTS: Jarvis.entitlements
        CODE_SIGN_ENTITLEMENTS: $(JARVIS_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  # Share → Jarvis: Holo Drop's Orbit popup for whatever was shared. Sandboxed (every app
  # extension is); reaches Jarvis through jc-client's loopback proxy, whose address the app
  # writes to ~/.jarviscopilot-client/holo-share.json. No restricted entitlements, so it signs
  # with the same profile-free Apple Development identity as the app.
  JarvisHoloShare:
    type: app-extension
    platform: macOS
    sources:
      - path: HoloShare
      - path: Sources/HoloDrop/HoloDropModels.swift
      - path: Sources/HoloDrop/HoloDropAPI.swift
      - path: Sources/HoloDrop/HoloOrbitView.swift
      - path: Sources/HoloDrop/HoloTemp.swift
      - path: ../../ios_app/JarvisCopilot/Copilot/Shared/JcAccent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarviscopilot.mac.holoshare
        PRODUCT_NAME: JarvisHoloShare
        PRODUCT_MODULE_NAME: JarvisHoloShare
        INFOPLIST_FILE: HoloShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: HoloShare/HoloShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
  # The "Jarvis Glasses" camera FaceTime, Zoom and Meet can pick: a CoreMediaIO camera
  # extension with a source stream (what apps read) and a sink stream (the app writes the
  # glasses' frames into it). Sandboxed, like every camera extension. It only LOADS from a
  # Developer ID-signed, notarized Jarvis in /Applications (scripts/build-developer-id.sh);
  # the everyday Apple Development build compiles and embeds it all the same.
  JarvisGlassesCamera:
    type: system-extension
    platform: macOS
    sources:
      - path: GlassesCamera
      - path: Sources/GlassesCamera/GlassesCameraKit.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarviscopilot.mac.glassescamera
        # A system extension's bundle is named after its identifier.
        PRODUCT_NAME: com.jarviscopilot.mac.glassescamera
        PRODUCT_MODULE_NAME: JarvisGlassesCamera
        INFOPLIST_FILE: GlassesCamera/Info.plist
        CODE_SIGN_ENTITLEMENTS: GlassesCamera/GlassesCamera.entitlements
        GENERATE_INFOPLIST_FILE: NO
        # The signing certificate's real team (its OU): the Mach service name and app group
        # in Info.plist / the entitlements start with $(TeamIdentifierPrefix).
        DEVELOPMENT_TEAM: VY5CNF8734
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  JarvisTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Jarvis
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Jarvis.app/Contents/MacOS/Jarvis"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Jarvis:
    build:
      targets:
        Jarvis: all
        JarvisTests: [test]
    test:
      targets: [JarvisTests]
