name: jarviscopilot_mobile
description: JarvisCopilot mobile client (iOS + Android) — pair with a JarvisCopilot server, run native skills, host the webui via a hybrid native + webview shell.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ── Networking ────────────────────────────────────────────────
  # dio for HTTP with a custom IOHttpClientAdapter that supports cert
  # pinning. web_socket_channel + the IOWebSocketChannel transport gives
  # us a single thread-safe handle we can share between the Service
  # connection loop and the skill executors.
  dio: ^5.4.0
  web_socket_channel: ^2.4.3

  # ── Secure storage ───────────────────────────────────────────
  # Keychain on iOS, EncryptedSharedPreferences on Android. Holds the
  # session cookie + server URL + TLS fingerprint.
  flutter_secure_storage: ^9.0.0

  # ── Skill bridge platform integrations ───────────────────────
  # Clipboard, vibration on Android, and a few other low-level ops use
  # Flutter's own platform channels (Clipboard, HapticFeedback) rather
  # than dedicated plugins — fewer transitive deps that way.
  url_launcher: ^6.2.5         # open_url, make_call, run_shortcut
  share_plus: ^7.2.2           # share_text, share_image
  device_info_plus: ^9.1.2     # device_info skill
  battery_plus: ^5.0.3         # battery_level
  vibration: ^2.0.0            # vibrate
  flutter_local_notifications: ^17.0.0  # notify skill
  geolocator: ^11.0.0          # get_location
  image_picker: ^1.0.7         # take_photo, pick_photo
  flutter_tts: ^4.0.2          # text_to_speech
  record: ^5.0.4               # record_audio
  flutter_contacts: ^1.1.7+1   # read_contacts (Android + iOS)
  add_2_calendar: ^3.0.1       # add_calendar_event
  device_calendar: ^4.3.2      # list_calendar_events

  # ── UI ───────────────────────────────────────────────────────
  flutter_markdown_plus: ^1.0.0    # streaming chat markdown (drop-in for the discontinued flutter_markdown)
  mobile_scanner: ^7.2.0          # QR scan on pair page
  flutter_inappwebview: ^6.0.0    # /more grid + webview wrapper
  permission_handler: ^11.3.0     # uniform mobile permission requests
  audioplayers: ^6.0.0            # voice playback
  path_provider: ^2.1.2           # absolute paths for record + caches

  # ── Push ─────────────────────────────────────────────────────
  # firebase_messaging covers both APNs (via Firebase) and FCM. We use
  # the bare bones API; the server signs its own JWTs and posts directly
  # to FCM HTTP v1 / APNs HTTP/2, so the only thing the app does is
  # register and forward the token + tap callbacks.
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.20

  # ── Misc ─────────────────────────────────────────────────────
  intl: ^0.19.0
  speech_to_text: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

dependency_overrides:
  record_linux: 1.3.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/   # uncomment when you add files under mobile_client/assets/
